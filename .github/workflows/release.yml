name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Get version from tag
        id: tag_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Get version from pyproject.toml
        id: pyproject_version
        run: |
          VERSION=$(grep -m1 'version = ' pyproject.toml | cut -d'"' -f2)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Verify versions match
        run: |
          if [ "${{ steps.tag_version.outputs.VERSION }}" != "${{ steps.pyproject_version.outputs.VERSION }}" ]; then
            echo "ERROR: Tag version (${{ steps.tag_version.outputs.VERSION }}) does not match pyproject.toml version (${{ steps.pyproject_version.outputs.VERSION }})"
            exit 1
          fi
          echo "✓ Versions match: ${{ steps.tag_version.outputs.VERSION }}"

      - name: Run linter
        run: uv run ruff check

      - name: Run tests
        run: uv run pytest -vv

  publish:
    runs-on: ubuntu-latest
    needs: verify
    environment: release
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.13

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        run: uv publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## Installation

            ```bash
            pip install ojs_scraper
            ```
          files: dist/*
          generate_release_notes: true
